# Deployment of the PanFS StorageClass operator: one pod that watches the PanfsStorageClass resources
# and creates a StorageClass of the PanFS CSI driver for each of them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
    product: com.vdura.csi.panfs
    {{- if .Values.labels }}
    {{- toYaml .Values.labels | nindent 4 }}
    {{- end }}
spec:
  replicas: 1

  # Never two operators at one time
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: {{ .Release.Name }}

  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        product: com.vdura.csi.panfs
        {{- if .Values.labels }}
        {{- toYaml .Values.labels | nindent 8 }}
        {{- end }}

    spec:
      serviceAccountName: {{ .Release.Name }}
      {{- if .Values.imagePullSecrets }}

      # Please make sure you have created the image pull secret in the same namespace
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}

      containers:
        - name: operator
          image: {{ .Values.image | replace "{{ .Chart.AppVersion }}" .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          args:
            - "--v={{ .Values.logLevel }}"
            - "--resync={{ .Values.resync }}"
            - "--csi-driver-namespace={{ .Values.csiDriverNamespace }}"
            - "--csi-controller-service-account={{ .Values.csiControllerServiceAccount }}"
          {{- if .Values.resources }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- end }}

          # The operator only talks to the Kubernetes API
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
