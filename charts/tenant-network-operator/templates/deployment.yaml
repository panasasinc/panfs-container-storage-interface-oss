# Deployment of the PanFS Tenant Network operator: one pod that watches the TenantNetwork resources.
# The operator itself creates the node pods later, as one DaemonSet per TenantNetwork, in the namespace of that resource.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
    product: com.vdura.csi.panfs
    {{- if .Values.labels }}
    {{- toYaml .Values.labels | nindent 4 }}
    {{- end }}
spec:
  replicas: 1

  # Never two operators at one time
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: {{ .Release.Name }}

  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        product: com.vdura.csi.panfs
        {{- if .Values.labels }}
        {{- toYaml .Values.labels | nindent 8 }}
        {{- end }}

    spec:
      serviceAccountName: {{ .Release.Name }}
      {{- if .Values.imagePullSecrets }}

      # Please make sure you have created the image pull secret in the same namespace
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}

      containers:
        - name: operator
          image: &image {{ .Values.image | replace "{{ .Chart.AppVersion }}" .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          args:
            - "--operator"
            - "--v={{ .Values.logLevel }}"
            - "--resync={{ .Values.resync }}"
            - "--node-image-pull-policy={{ .Values.pullPolicy }}"
            - "--node-image-pull-secrets={{ join "," .Values.imagePullSecrets }}"
            - "--node-cluster-role={{ .Release.Namespace }}-{{ .Release.Name }}-node"
            - "--node-priority-class={{ .Values.nodePriorityClassName }}"
            - "--interval={{ .Values.interval }}"
            - "--firewalld-zone={{ .Values.firewalldZone }}"
            - "--detach-on-removal={{ .Values.detachOnRemoval }}"
            - "--vlan-parent={{ .Values.vlanParentInterface }}"
          env:
            # The node pods run the same image as the operator
            - name: NODE_IMAGE
              value: *image
          {{- if .Values.resources }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- end }}

          # The operator only talks to the Kubernetes API and to PanAPI
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
