# -- Image of the PanFS Tenant Network program. The operator and the pods it creates on the nodes use the same image.
# @default -- `...`
image: ghcr.io/panasasinc/panfs-container-storage-interface-oss/panfs-tenant-network:{{ .Chart.AppVersion }}

# -- Image pull policy
pullPolicy: IfNotPresent

# -- List of image pull secrets for private registries. Each Secret must exist in the namespace of the operator
# and in the namespace of every TenantNetwork, because the operator creates the node pods there.
imagePullSecrets: []

# -- Time between two passes of the operator over the TenantNetwork resources
resync: 15s

# -- Default time between two checks of the tenant network on a node
interval: 30s

# -- Default firewalld zone that the tenant interface is moved to on nodes that run firewalld.
# The realm opens connections to the PanFS client, and the default zone usually drops them.
# Set it to an empty string to leave firewalld alone.
firewalldZone: trusted

# -- Only for a realm that places subnets on VLAN segments: default name of the interface of the nodes
# that carries the VLAN. An empty value means the interface with the underlay address of the node.
vlanParentInterface: ""

# -- Default for what a node pod does when its node leaves the tenant: the label `panfs.vdura.com/tenant` is removed
# from the node, or the TenantNetwork is deleted. With `true`, the pod removes the tenant interface and detaches the node
# from the subnet in the realm. With `false`, both stay. A restart or an upgrade of the pods never detaches a node.
detachOnRemoval: true

# -- Namespace of the PanFS CSI driver, for the StorageClasses that the operator creates from PanfsStorageClass resources:
# the CSI controller in that namespace gets the permission to read the realm Secret.
# Leave it empty to read the namespace from the CSIDriver object `com.vdura.csi.panfs`, where the driver chart writes it.
csiDriverNamespace: ""

# -- ServiceAccount of the CSI controller in that namespace. Leave it empty to use the name that the driver chart
# gives it: `<namespace of the driver>-controller`, for example `csi-panfs-controller`.
csiControllerServiceAccount: ""

# -- Log verbosity (klog level) of the operator and of the node pods
logLevel: 2

# -- Labels for the operator Deployment and its pod
labels: {}

# -- Priority class of the node pods
nodePriorityClassName: ""

# -- Resource requests and limits of the operator container
resources: {}
  # requests:
  #   cpu: 10m
  #   memory: 32Mi
  # limits:
  #   memory: 128Mi
