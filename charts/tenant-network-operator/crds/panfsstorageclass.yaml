# PanfsStorageClass asks the PanFS Tenant Network operator to create a StorageClass of the PanFS CSI driver.
# The operator fills in the provisioner, the references to the realm Secret and, with a tenant network, allowedTopologies.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: panfsstorageclasses.panfs.vdura.com
  labels:
    product: com.vdura.csi.panfs
spec:
  group: panfs.vdura.com
  scope: Namespaced
  names:
    kind: PanfsStorageClass
    listKind: PanfsStorageClassList
    plural: panfsstorageclasses
    singular: panfsstorageclass
    shortNames:
      - psc
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: StorageClass
          type: string
          jsonPath: .status.storageClass
        - name: Tenant-Network
          type: string
          jsonPath: .spec.tenantNetwork
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Message
          type: string
          jsonPath: .status.message
          priority: 1
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: ["spec"]
          properties:
            spec:
              type: object
              x-kubernetes-validations:
                - rule: "has(self.tenantNetwork) != has(self.realmSecretName)"
                  message: exactly one of spec.tenantNetwork and spec.realmSecretName is required
                - rule: "!has(self.tenantNetwork) || !has(self.volumeBindingMode) || self.volumeBindingMode == 'Immediate'"
                  message: spec.volumeBindingMode must be Immediate, or left out, with spec.tenantNetwork
              properties:
                tenantNetwork:
                  description: >-
                    Name of a TenantNetwork in the namespace of this resource. The StorageClass uses the Secret of
                    that TenantNetwork, and its volumes are bound to the nodes where the network of the tenant works.
                    Exactly one of tenantNetwork and realmSecretName is required.
                  type: string
                  minLength: 1
                realmSecretName:
                  description: >-
                    For a realm that is reachable without a tenant network: name of a Secret in the namespace of this
                    resource with the keys api (PanAPI address of the realm), token (PanAPI service account token)
                    and, optionally, ca_cert. Exactly one of tenantNetwork and realmSecretName is required.
                  type: string
                  minLength: 1
                parameters:
                  description: >-
                    Optional. PanFS parameters of new volumes, for example panfs.csi.vdura.com/layout. They reach the
                    StorageClass unchanged; without them the defaults of the driver apply. The parameters that start
                    with csi.storage.k8s.io/ are set by the operator. They cannot change after the StorageClass was created.
                  type: object
                  additionalProperties:
                    x-kubernetes-int-or-string: true
                allowVolumeExpansion:
                  description: Optional. Whether a volume can be expanded. The default is true.
                  type: boolean
                reclaimPolicy:
                  description: >-
                    Optional. What happens to a volume when its PersistentVolumeClaim is deleted: Delete (the default)
                    or Retain. It cannot change after the StorageClass was created.
                  type: string
                  enum: ["Delete", "Retain"]
                volumeBindingMode:
                  description: >-
                    Optional. Immediate or WaitForFirstConsumer. With tenantNetwork it is always Immediate: the volume
                    is created at once and bound to the nodes of the tenant network. With realmSecretName the default
                    is WaitForFirstConsumer. It cannot change after the StorageClass was created.
                  type: string
                  enum: ["Immediate", "WaitForFirstConsumer"]
                mountOptions:
                  description: Optional. Mount options of the volumes.
                  type: array
                  items:
                    type: string
                default:
                  description: Optional. Whether the StorageClass is the default one of the cluster. The default is false.
                  type: boolean
            status:
              type: object
              properties:
                phase:
                  description: >-
                    Ready: the StorageClass is in place. Pending: the operator waits for the TenantNetwork.
                    Error: the message says what is wrong.
                  type: string
                message:
                  type: string
                storageClass:
                  description: Name of the StorageClass that the operator created for this resource. It is the name of the resource.
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
