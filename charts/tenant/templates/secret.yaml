{{- if eq .Release.Namespace "default" }}
{{- fail "Installation into the 'default' namespace is not permitted. Use --namespace <namespace>." }}
{{- end }}
{{- if not .Values.existingSecret }}
# SPDX-License-Identifier: Apache-2.0
# Copyright 2025 VDURA Inc.

# Connection of the tenant to the PanFS realm: PanAPI address and service account token
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
    product: com.vdura.csi.panfs
type: Opaque
stringData:
  # PanAPI address of the PanFS realm: a host (HTTPS is used) or a full https:// or http:// URL
  api: {{ required "realm.api is required, or name a Secret with existingSecret" .Values.realm.api | quote }}

  # PanAPI service account token of the tenant
  token: {{ required "realm.token is required, or name a Secret with existingSecret" .Values.realm.token | quote }}
{{- if .Values.realm.caCert }}

  # PEM certificate of the CA that signed the realm certificate
  ca_cert: |
{{ .Values.realm.caCert | indent 4 }}
{{- end }}
{{- if .Values.realm.insecureSkipTLSVerify }}

  # The realm certificate is not verified: the connection is encrypted, but the identity of the realm is not checked
  insecure_skip_tls_verify: "true"
{{- end }}
{{- end }}
