{{- if and .Values.tenant .Values.tenantNetwork.create }}
{{- if not (regexMatch "^[A-Za-z0-9]([A-Za-z0-9_.-]{0,61}[A-Za-z0-9])?$" .Values.tenant) }}
{{- fail "tenant must be a valid Kubernetes label value" }}
{{- end }}
# SPDX-License-Identifier: Apache-2.0
# Copyright 2025 VDURA Inc.

# Ask the PanFS Tenant Network operator to put the nodes of the tenant on the tenant network.
# The operator runs a pod on every node that nodeSelector selects,
# and each pod sets the label panfs.vdura.com/tenant-network=<this namespace> on its node when the network works.
apiVersion: panfs.vdura.com/v1alpha1
kind: TenantNetwork
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
    product: com.vdura.csi.panfs
spec:
  # The Secret of this StorageClass: PanAPI address and token of the tenant
  secretName: {{ .Release.Name }}

  # The nodes of the tenant
  nodeSelector:
    panfs.vdura.com/tenant: {{ .Values.tenant | quote }}
{{- end }}
