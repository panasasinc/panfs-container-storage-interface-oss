---
{{- if eq .Release.Namespace "default" }}
{{- required "Error: .Release.Namespace must not be 'default'. Please specify a non-default namespace with --namespace <namespace> option." nil }}
{{- end }}
# SPDX-License-Identifier: Apache-2.0
# Copyright 2025 VDURA Inc.

# Secret for the PanFS Storage Class (PanAPI address and service account token)
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
    product: com.vdura.csi.panfs
type: Opaque
stringData:
  # PanAPI address of the PanFS realm: a host (HTTPS is used) or a full https:// or http:// URL.
  # The CSI controller calls PanAPI at this address. The nodes mount volumes from its host,
  # unless PanAPI names another mount address for the tenant.
  api: {{ required "realm.api is required!" .Values.realm.api | quote }}

  # PanAPI service account token
  token: {{ required "realm.token is required!" .Values.realm.token | quote }}
{{- if .Values.realm.caCert }}

  # PEM certificate of the CA that signed the realm certificate
  ca_cert: |
{{ .Values.realm.caCert | indent 4 }}
{{- end }}
