# Everything is optional. In the namespace of a TenantNetwork, the defaults give a working StorageClass.

# -- Only for a realm that is reachable without a tenant network, in a namespace without a `TenantNetwork`:
# name of a Secret in the namespace of the release with the keys `api` and `token`, and optionally `ca_cert`.
# Leave it empty in the namespace of a `TenantNetwork`: the operator uses the Secret of the `TenantNetwork`.
realmSecretName: ""

# -- PanFS parameters of new volumes, for example `panfs.csi.vdura.com/layout`. Without them the defaults of the driver apply.
# They cannot change after the StorageClass was created.
parameters: {}
  # panfs.csi.vdura.com/layout: "raid6+"
  # panfs.csi.vdura.com/stripeunit: "64k"

# -- `Delete` or `Retain`. Empty means the default of the operator: `Delete`.
# It cannot change after the StorageClass was created.
reclaimPolicy: ""

# -- (bool) Whether a volume can be expanded. Empty means the default of the operator: `true`.
allowVolumeExpansion:

# -- `Immediate` or `WaitForFirstConsumer`. Empty means the default of the operator: `Immediate` with a tenant network,
# `WaitForFirstConsumer` without one. It cannot change after the StorageClass was created.
volumeBindingMode: ""

# -- Mount options of the volumes
mountOptions: []

# -- Make the StorageClass the default one of the cluster
default: false

# -- Check that the PanFS Tenant operator is installed before anything is created.
# Set it to `false` only to render or lint the chart without a cluster.
checkOperator: true
