# PanFS CSI Driver details
csiPanFSDriver:
  # -- Namespace where the PanFS CSI driver is deployed
  namespace: csi-panfs

# -- Allowed topologies for volume provisioning
# This can be used to restrict volume provisioning to specific nodes or zones
# based on node labels. Uncomment and modify the example below as needed.
# If left empty, no topology constraints will be applied.
allowedTopologies: {}
  # - matchLabelExpressions:
  #   - key: node.kubernetes.io/csi-panfs.panfs.ready
  #     values:
  #       - "true"

# PanFS Realm API (PanAPI) connection
realm:
  # -- PanAPI address of the PanFS realm: a host name or IP address (HTTPS is used), or a full `https://` or `http://` URL.
  # The nodes mount volumes from the host of this address.
  api: ""
  # -- PanAPI service account token. Its tenant must have the storageset of the StorageClass assigned.
  token: ""
  # -- Optional PEM certificate of the CA that signed the realm certificate. Leave empty to use the system trust store.
  caCert: ""

# -- Whether to set this storage class as the default for the cluster
setAsDefaultStorageClass: false

# -- Allow expansion of provisioned volumes
allowVolumeExpansion: true

# -- Default reclaim policy for volumes
# @default -- `Delete`
volumeReclaimPolicy: Delete # Options: Retain, Delete

# -- Default volume binding mode
volumeBindingMode: WaitForFirstConsumer # Options: Immediate, WaitForFirstConsumer

# -- Storage class parameters. `panfs.csi.vdura.com/storageset_id` is required; the others are optional.
# @default -- `{...}`
parameters:
  # Numeric id of the storageset that holds new volumes (required)
  panfs.csi.vdura.com/storageset_id: ""

  panfs.csi.vdura.com/recoverypriority: "50"
  panfs.csi.vdura.com/efsa: "retry"
  panfs.csi.vdura.com/layout: "raid6+"
  panfs.csi.vdura.com/maxwidth: 3
  panfs.csi.vdura.com/stripeunit: "64k"
  panfs.csi.vdura.com/rgwidth: 3
  panfs.csi.vdura.com/rgdepth: 2

  panfs.csi.vdura.com/operm: "all"

  # panfs.csi.vdura.com/volservice: "volserviceid"

  # Owner user and group: numeric ids only
  # panfs.csi.vdura.com/user: "1001"
  # panfs.csi.vdura.com/group: "100"
  # panfs.csi.vdura.com/uperm: "all"
  # panfs.csi.vdura.com/gperm: "write-execute"
  # panfs.csi.vdura.com/operm: "read-write"

mountOptions: []