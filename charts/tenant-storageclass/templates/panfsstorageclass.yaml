{{- /*
  A PanfsStorageClass can be created only when the PanFS StorageClass operator has installed its resource definition.
  Stop here with a clear message, before anything is created. "helm template" has no cluster: pass
  --api-versions panfs.vdura.com/v1alpha1/PanfsStorageClass there. "helm lint" cannot take that flag: set checkOperator=false.
*/}}
{{- if and .Values.checkOperator (not (.Capabilities.APIVersions.Has "panfs.vdura.com/v1alpha1/PanfsStorageClass")) }}
{{- fail "The PanFS StorageClass operator is not installed in this cluster: the resource kind PanfsStorageClass (panfs.vdura.com/v1alpha1) is unknown. Install the chart panfs-storageclass-operator first. To render the chart without a cluster, pass --api-versions panfs.vdura.com/v1alpha1/PanfsStorageClass or set checkOperator=false." }}
{{- end }}
# SPDX-License-Identifier: Apache-2.0
# Copyright 2025 VDURA Inc.

# Ask the PanFS StorageClass operator for a StorageClass with the name {{ .Release.Name }}.
# In the namespace of a TenantNetwork, the operator takes the Secret and the nodes of the tenant from that TenantNetwork.
apiVersion: panfs.vdura.com/v1alpha1
kind: PanfsStorageClass
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
    product: com.vdura.csi.panfs
{{- $spec := dict }}
{{- if .Values.realmSecretName }}{{ $_ := set $spec "realmSecretName" .Values.realmSecretName }}{{ end }}
{{- if .Values.parameters }}{{ $_ := set $spec "parameters" .Values.parameters }}{{ end }}
{{- if .Values.reclaimPolicy }}{{ $_ := set $spec "reclaimPolicy" .Values.reclaimPolicy }}{{ end }}
{{- if not (kindIs "invalid" .Values.allowVolumeExpansion) }}{{ $_ := set $spec "allowVolumeExpansion" .Values.allowVolumeExpansion }}{{ end }}
{{- if .Values.volumeBindingMode }}{{ $_ := set $spec "volumeBindingMode" .Values.volumeBindingMode }}{{ end }}
{{- if .Values.mountOptions }}{{ $_ := set $spec "mountOptions" .Values.mountOptions }}{{ end }}
{{- if .Values.default }}{{ $_ := set $spec "default" true }}{{ end }}
{{- if $spec }}
spec:
  {{- toYaml $spec | nindent 2 }}
{{- end }}
