name: Create Release

on:
  workflow_dispatch:
    # The release version is not an input: it is the appVersion of charts/panfs/Chart.yaml on main.
    # Set the version everywhere in a pull request first (see `make check-version`), then run this workflow.
    inputs:
      draft:
        description: 'Create the GitHub Release as a draft'
        required: false
        type: boolean
        default: false

jobs:
  # Runs first: reads the release version from the driver chart, and stops the release
  # while a chart, a manifest or a document names another version, or when the tag already exists.
  check-version:
    name: Version consistency
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Releases must be cut from the main branch only
      - name: Validate branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases must be created from the main branch (got '${{ github.ref }}')"
          exit 1

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history is required to check existing tags
          fetch-depth: 0

      - name: Read the release version from the driver chart
        id: version
        run: |
          VERSION=$(sed -n -E 's/^appVersion: "([^"]*)"$/\1/p' charts/panfs/Chart.yaml)
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::appVersion '$VERSION' in charts/panfs/Chart.yaml must match X.Y.Z (e.g. 1.2.6)"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag '$VERSION' already exists. Set the next version in a pull request before releasing."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: **$VERSION**" >> "$GITHUB_STEP_SUMMARY"

      - name: Check that everything uses the release version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make check-version VERSION="$VERSION"

  create-release:
    name: Tag and GitHub Release
    needs: check-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ needs.check-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history is required to generate release notes
          fetch-depth: 0

      # The changelog entry of the next release is marked "Unreleased" on main.
      # Stamp it with the release date, and fail when the release has no entry.
      - name: Stamp CHANGELOG.md
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          escaped="${VERSION//./\\.}"
          if ! grep -Eq "^## \[$escaped\]( |$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for $VERSION. Add '## [$VERSION] - Unreleased' with the changes first."
            exit 1
          fi
          sed -i -E "s/^## \[$escaped\] - Unreleased\$/## [$VERSION] - $(date -u +%F)/" CHANGELOG.md
          sed -i -E "s#^(\[$escaped\]: .*)\.\.\.HEAD\$#\1...$VERSION#" CHANGELOG.md
          git diff --stat -- CHANGELOG.md

      # The chart versions are set in a pull request before the release (the check-version job enforces it),
      # so the changelog stamp is the only change that this workflow commits.
      - name: Commit the changelog stamp and push tag
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add CHANGELOG.md
            git commit -m "chore(release): $VERSION"
            git push origin main
          fi
          git tag "$VERSION"
          git push origin "refs/tags/$VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            ${{ inputs.draft && '--draft' || '' }}

  # Tags pushed with GITHUB_TOKEN do not trigger the tag-based
  # "Release builds" workflow, so build and push the image directly.
  csi-driver-image-ghcr:
    needs: create-release
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/build-reusable.yaml
    with:
      runner-label: "ubuntu-latest"
      app-version: "${{ needs.create-release.outputs.version }}"
      image-name: "panfs-csi-driver"
      image-tags: "${{ needs.create-release.outputs.version }}"
      repo-url: "ghcr.io/${{ github.repository }}"
      ref: "refs/tags/${{ needs.create-release.outputs.version }}"
      trivy-scan: false
      push: true
    secrets: inherit

  tenant-network-image-ghcr:
    needs: create-release
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/build-reusable.yaml
    with:
      runner-label: "ubuntu-latest"
      app-version: "${{ needs.create-release.outputs.version }}"
      build-target: "tenant-network"
      image-name: "panfs-tenant-network"
      image-tags: "${{ needs.create-release.outputs.version }}"
      repo-url: "ghcr.io/${{ github.repository }}"
      ref: "refs/tags/${{ needs.create-release.outputs.version }}"
      trivy-scan: false
      push: true
    secrets: inherit

  storageclass-operator-image-ghcr:
    needs: create-release
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/build-reusable.yaml
    with:
      runner-label: "ubuntu-latest"
      app-version: "${{ needs.create-release.outputs.version }}"
      build-target: "storageclass-operator"
      image-name: "panfs-storageclass-operator"
      image-tags: "${{ needs.create-release.outputs.version }}"
      repo-url: "ghcr.io/${{ github.repository }}"
      ref: "refs/tags/${{ needs.create-release.outputs.version }}"
      trivy-scan: false
      push: true
    secrets: inherit
