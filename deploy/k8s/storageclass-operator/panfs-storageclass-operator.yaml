# PanfsStorageClass asks the PanFS StorageClass operator to create a StorageClass of the PanFS CSI driver.
# The operator fills in the provisioner, the references to the realm Secret and, with a tenant network, allowedTopologies.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: panfsstorageclasses.panfs.vdura.com
  labels:
    product: com.vdura.csi.panfs
spec:
  group: panfs.vdura.com
  scope: Namespaced
  names:
    kind: PanfsStorageClass
    listKind: PanfsStorageClassList
    plural: panfsstorageclasses
    singular: panfsstorageclass
    shortNames:
      - psc
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: StorageClass
          type: string
          jsonPath: .status.storageClass
        - name: Tenant-Network
          type: string
          jsonPath: .spec.tenantNetwork
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Message
          type: string
          jsonPath: .status.message
          priority: 1
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: ["spec"]
          properties:
            spec:
              type: object
              x-kubernetes-validations:
                - rule: "has(self.tenantNetwork) != has(self.realmSecretName)"
                  message: exactly one of spec.tenantNetwork and spec.realmSecretName is required
                - rule: "!has(self.tenantNetwork) || !has(self.volumeBindingMode) || self.volumeBindingMode == 'Immediate'"
                  message: spec.volumeBindingMode must be Immediate, or left out, with spec.tenantNetwork
              properties:
                tenantNetwork:
                  description: >-
                    Name of a TenantNetwork in the namespace of this resource. The StorageClass uses the Secret of
                    that TenantNetwork, and its volumes are bound to the nodes where the network of the tenant works.
                    Exactly one of tenantNetwork and realmSecretName is required.
                  type: string
                  minLength: 1
                realmSecretName:
                  description: >-
                    For a realm that is reachable without a tenant network: name of a Secret in the namespace of this
                    resource with the keys api (PanAPI address of the realm), token (PanAPI service account token)
                    and, optionally, ca_cert. Exactly one of tenantNetwork and realmSecretName is required.
                  type: string
                  minLength: 1
                parameters:
                  description: >-
                    Optional. PanFS parameters of new volumes, for example panfs.csi.vdura.com/layout. They reach the
                    StorageClass unchanged; without them the defaults of the driver apply. The parameters that start
                    with csi.storage.k8s.io/ are set by the operator. They cannot change after the StorageClass was created.
                  type: object
                  additionalProperties:
                    x-kubernetes-int-or-string: true
                allowVolumeExpansion:
                  description: Optional. Whether a volume can be expanded. The default is true.
                  type: boolean
                reclaimPolicy:
                  description: >-
                    Optional. What happens to a volume when its PersistentVolumeClaim is deleted: Delete (the default)
                    or Retain. It cannot change after the StorageClass was created.
                  type: string
                  enum: ["Delete", "Retain"]
                volumeBindingMode:
                  description: >-
                    Optional. Immediate or WaitForFirstConsumer. With tenantNetwork it is always Immediate: the volume
                    is created at once and bound to the nodes of the tenant network. With realmSecretName the default
                    is WaitForFirstConsumer. It cannot change after the StorageClass was created.
                  type: string
                  enum: ["Immediate", "WaitForFirstConsumer"]
                mountOptions:
                  description: Optional. Mount options of the volumes.
                  type: array
                  items:
                    type: string
                default:
                  description: Optional. Whether the StorageClass is the default one of the cluster. The default is false.
                  type: boolean
            status:
              type: object
              properties:
                phase:
                  description: >-
                    Ready: the StorageClass is in place. Pending: the operator waits for the TenantNetwork.
                    Error: the message says what is wrong.
                  type: string
                message:
                  type: string
                storageClass:
                  description: Name of the StorageClass that the operator created for this resource. It is the name of the resource.
                  type: string
                observedGeneration:
                  type: integer
                  format: int64

---
# SPDX-License-Identifier: Apache-2.0
# Copyright 2025 VDURA Inc.

# ServiceAccount of the PanFS StorageClass operator
apiVersion: v1
kind: ServiceAccount
metadata:
  name: panfs-storageclass-operator
  namespace: csi-panfs
  labels:
    app: panfs-storageclass-operator
    product: com.vdura.csi.panfs

---
# SPDX-License-Identifier: Apache-2.0
# Copyright 2025 VDURA Inc.

# ClusterRole of the operator. PanfsStorageClasses can be in any namespace, and a StorageClass has no namespace,
# so the permissions are cluster-wide.
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: csi-panfs-panfs-storageclass-operator
  labels:
    app: panfs-storageclass-operator
    product: com.vdura.csi.panfs
rules:
  # Read the PanfsStorageClasses, hold them with a finalizer, and report their status
  - apiGroups: ["panfs.vdura.com"]
    resources: ["panfsstorageclasses"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["panfs.vdura.com"]
    resources: ["panfsstorageclasses/status", "panfsstorageclasses/finalizers"]
    verbs: ["update", "patch"]

  # Read the TenantNetwork that a PanfsStorageClass names: its Secret and the node label of the tenant network.
  # The TenantNetwork resource comes with the PanFS Tenant Network operator; without it, this rule is unused
  - apiGroups: ["panfs.vdura.com"]
    resources: ["tenantnetworks"]
    verbs: ["get"]

  # The StorageClass of a PanfsStorageClass
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "create", "update", "delete"]

  # Read the namespace of the PanFS CSI driver from its CSIDriver object
  - apiGroups: ["storage.k8s.io"]
    resources: ["csidrivers"]
    resourceNames: ["com.vdura.csi.panfs"]
    verbs: ["get"]

  # Find out whether a deleted PanfsStorageClass left volumes that still need its Secret
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["list"]

  # The operator checks that the Secret of a PanfsStorageClass exists, and it gives the CSI controller
  # the permission to read that Secret. It can give only a permission that it holds itself
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]

  # The Role and the RoleBinding that let the CSI controller read the Secret of a PanfsStorageClass
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "create", "update", "delete"]

  # Report changes as events on a PanfsStorageClass
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]

---
# SPDX-License-Identifier: Apache-2.0
# Copyright 2025 VDURA Inc.

# Bind the ClusterRole to the ServiceAccount of the operator
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: csi-panfs-panfs-storageclass-operator
  labels:
    app: panfs-storageclass-operator
    product: com.vdura.csi.panfs
subjects:
  - kind: ServiceAccount
    name: panfs-storageclass-operator
    namespace: csi-panfs
roleRef:
  kind: ClusterRole
  name: csi-panfs-panfs-storageclass-operator
  apiGroup: rbac.authorization.k8s.io

---
# SPDX-License-Identifier: Apache-2.0
# Copyright 2025 VDURA Inc.

# Deployment of the PanFS StorageClass operator: one pod that watches the PanfsStorageClass resources
# and creates a StorageClass of the PanFS CSI driver for each of them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: panfs-storageclass-operator
  namespace: csi-panfs
  labels:
    app: panfs-storageclass-operator
    product: com.vdura.csi.panfs
spec:
  replicas: 1

  # Never two operators at one time
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: panfs-storageclass-operator

  template:
    metadata:
      labels:
        app: panfs-storageclass-operator
        product: com.vdura.csi.panfs

    spec:
      serviceAccountName: panfs-storageclass-operator

      containers:
        - name: operator
          image: ghcr.io/panasasinc/panfs-container-storage-interface-oss/panfs-storageclass-operator:2.0.0
          imagePullPolicy: IfNotPresent
          args:
            - "--v=2"
            - "--resync=15s"
            - "--csi-driver-namespace="
            - "--csi-controller-service-account="

          # The operator only talks to the Kubernetes API
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
