# TenantNetwork asks the PanFS Tenant Network operator to put the nodes of one PanFS tenant on the network of that tenant.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tenantnetworks.panfs.vdura.com
  labels:
    product: com.vdura.csi.panfs
spec:
  group: panfs.vdura.com
  scope: Namespaced
  names:
    kind: TenantNetwork
    listKind: TenantNetworkList
    plural: tenantnetworks
    singular: tenantnetwork
    shortNames:
      - ptn
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Tenant
          type: string
          jsonPath: .status.tenant
        - name: Nodes
          type: integer
          jsonPath: .status.desiredNodes
        - name: Ready
          type: integer
          jsonPath: .status.readyNodes
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Ready-Label
          type: string
          jsonPath: .status.readyLabel
          priority: 1
        - name: Message
          type: string
          jsonPath: .status.message
          priority: 1
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: ["spec"]
          properties:
            spec:
              type: object
              required: ["realmSecretName"]
              properties:
                realmSecretName:
                  description: >-
                    Name of a Secret in the namespace of this resource with the keys api (PanAPI address of the realm),
                    token (PanAPI service account token of the tenant) and, optionally, ca_cert.
                    The tenant is the one the token belongs to.
                  type: string
                  minLength: 1
                nodeSelector:
                  description: >-
                    Optional. Labels that select the nodes of the tenant. Without it, they are all nodes of the cluster.
                    A node must match one TenantNetwork only.
                  type: object
                  additionalProperties:
                    type: string
                vlanParentInterface:
                  description: >-
                    Optional. Only for a realm that places subnets on VLAN segments: the interface of the nodes that
                    carries the VLAN. Without it, the interface with the underlay address of the node is used.
                  type: string
                  maxLength: 15
                  pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]*$"
                interval:
                  description: Optional. Time between two checks of the tenant network on a node, for example 30s.
                  type: string
                firewalldZone:
                  description: >-
                    Optional. firewalld zone of the tenant interface on nodes that run firewalld.
                    An empty string leaves firewalld alone.
                  type: string
                  maxLength: 17
                  pattern: "^[A-Za-z0-9_-]*$"
                detachOnRemoval:
                  description: >-
                    Optional. Whether a pod removes the tenant interface and detaches its node from the subnet
                    when the node leaves the tenant.
                  type: boolean
            status:
              type: object
              properties:
                phase:
                  description: Ready, Pending, Error or Removing.
                  type: string
                message:
                  type: string
                tenant:
                  description: Name of the tenant the token belongs to.
                  type: string
                readyLabel:
                  description: >-
                    The label that the pods set on a node where the network of the tenant works:
                    panfs.vdura.com/tenant-network=<namespace of this resource>. Use it to place workloads.
                  type: string
                daemonSet:
                  description: Name of the DaemonSet the operator created in this namespace.
                  type: string
                desiredNodes:
                  description: Number of nodes that the node selector matches.
                  type: integer
                  format: int64
                readyNodes:
                  description: Number of nodes where the tenant network works.
                  type: integer
                  format: int64
                observedGeneration:
                  type: integer
                  format: int64
                interface:
                  description: >-
                    Name of the tenant interface on the nodes: vxlan<id> on a VXLAN segment, vlan<id> on a VLAN segment.
                  type: string
                nodes:
                  description: State of every node that the node selector matches, by node name.
                  type: object
                  additionalProperties:
                    type: object
                    required: ["state"]
                    properties:
                      state:
                        description: Ready or NotReady.
                        type: string
                      overlayIP:
                        description: Address of the node on the tenant network.
                        type: string
                      message:
                        description: Why the node is not ready.
                        type: string

---
# SPDX-License-Identifier: Apache-2.0
# Copyright 2025 VDURA Inc.

# ServiceAccount of the PanFS Tenant Network operator
apiVersion: v1
kind: ServiceAccount
metadata:
  name: panfs-tenant-network-operator
  namespace: panfs-tenant-network
  labels:
    app: panfs-tenant-network-operator
    product: com.vdura.csi.panfs

---
# SPDX-License-Identifier: Apache-2.0
# Copyright 2025 VDURA Inc.

# ClusterRole of the node pods: read a node and patch its labels.
# The operator binds it to the ServiceAccount it creates for every TenantNetwork.
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: panfs-tenant-network-panfs-tenant-network-operator-node
  labels:
    app: panfs-tenant-network-operator
    product: com.vdura.csi.panfs
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "patch"]

---
# SPDX-License-Identifier: Apache-2.0
# Copyright 2025 VDURA Inc.

# ClusterRole of the operator. TenantNetworks can be in any namespace, so the permissions are cluster-wide.
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: panfs-tenant-network-panfs-tenant-network-operator
  labels:
    app: panfs-tenant-network-operator
    product: com.vdura.csi.panfs
rules:
  # Read the TenantNetworks, hold them with a finalizer, and report their status
  - apiGroups: ["panfs.vdura.com"]
    resources: ["tenantnetworks"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["panfs.vdura.com"]
    resources: ["tenantnetworks/status", "tenantnetworks/finalizers"]
    verbs: ["update", "patch"]

  # Read the Secret a TenantNetwork names: the operator asks PanAPI which tenant its token belongs to
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]

  # Read the state that the node pods report on their nodes, for the status of a TenantNetwork
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list"]

  # Report changes as events on a TenantNetwork; the node pods get the same permission in their namespace
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]

  # The DaemonSet of the node pods of a tenant
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "create", "update", "delete"]

  # The ServiceAccount of the node pods and its permissions
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "create"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "create", "update"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    verbs: ["get", "create", "delete"]

  # Allow binding the ClusterRole of the node pods, and nothing else
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames: ["panfs-tenant-network-panfs-tenant-network-operator-node"]
    verbs: ["bind"]

---
# SPDX-License-Identifier: Apache-2.0
# Copyright 2025 VDURA Inc.

# Bind the ClusterRole to the ServiceAccount of the operator
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: panfs-tenant-network-panfs-tenant-network-operator
  labels:
    app: panfs-tenant-network-operator
    product: com.vdura.csi.panfs
subjects:
  - kind: ServiceAccount
    name: panfs-tenant-network-operator
    namespace: panfs-tenant-network
roleRef:
  kind: ClusterRole
  name: panfs-tenant-network-panfs-tenant-network-operator
  apiGroup: rbac.authorization.k8s.io

---
# SPDX-License-Identifier: Apache-2.0
# Copyright 2025 VDURA Inc.

# Deployment of the PanFS Tenant Network operator: one pod that watches the TenantNetwork resources.
# The operator itself creates the node pods later, as one DaemonSet per TenantNetwork, in the namespace of that resource.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: panfs-tenant-network-operator
  namespace: panfs-tenant-network
  labels:
    app: panfs-tenant-network-operator
    product: com.vdura.csi.panfs
spec:
  replicas: 1

  # Never two operators at one time
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: panfs-tenant-network-operator

  template:
    metadata:
      labels:
        app: panfs-tenant-network-operator
        product: com.vdura.csi.panfs

    spec:
      serviceAccountName: panfs-tenant-network-operator

      containers:
        - name: operator
          image: &image ghcr.io/panasasinc/panfs-container-storage-interface-oss/panfs-tenant-network:2.0.0
          imagePullPolicy: IfNotPresent
          args:
            - "--operator"
            - "--v=2"
            - "--resync=15s"
            - "--node-image-pull-policy=IfNotPresent"
            - "--node-image-pull-secrets="
            - "--node-cluster-role=panfs-tenant-network-panfs-tenant-network-operator-node"
            - "--node-priority-class="
            - "--interval=30s"
            - "--firewalld-zone=trusted"
            - "--detach-on-removal=true"
            - "--vlan-parent="
          env:
            # The node pods run the same image as the operator
            - name: NODE_IMAGE
              value: *image

          # The operator only talks to the Kubernetes API and to PanAPI
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
