# Ask the PanFS Tenant operator to create a StorageClass of the PanFS CSI driver.
# The StorageClass gets the name of this resource. The operator fills in the provisioner, the references to
# the realm Secret and allowedTopologies, and it lets the CSI controller read the Secret.
apiVersion: panfs.vdura.com/v1alpha1
kind: PanfsStorageClass
metadata:
  name: <STORAGE_CLASS_NAME>
  namespace: <NAMESPACE>
spec:
  # Every field is optional. Remove what you do not need.

  # In the namespace of a TenantNetwork, the operator finds the TenantNetwork by itself: the StorageClass uses
  # its Secret, and every volume is bound to the nodes where the network of the tenant works.
  # Only for a realm that is reachable without a tenant network, in a namespace without a TenantNetwork,
  # name the Secret with the keys api and token:
  # realmSecretName: <SECRET_NAME>

  # PanFS parameters of new volumes. Without them the defaults of the driver apply.
  parameters:
    # Storageset that holds new volumes: its id or its name. Without it, the first storageset of the tenant is used.
    # panfs.csi.vdura.com/storageset: "<STORAGESET>"
    panfs.csi.vdura.com/layout: "raid6+"
    panfs.csi.vdura.com/stripeunit: "64k"

  # Delete (the default) or Retain
  reclaimPolicy: Delete

  # The default is true
  allowVolumeExpansion: true

  # Mount options of the volumes
  mountOptions: []

  # Make this StorageClass the default one of the cluster
  default: false
